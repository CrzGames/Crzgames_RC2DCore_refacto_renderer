name: Build project for librc2d static and example

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

env:
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_PLATFORM_VERSION: "android-36"
  ANDROID_BUILD_TOOLS_VERSION: "36.1.0"
  ANDROID_CMAKE_VERSION: "3.30.3"
  ANDROID_CMDLINE_TOOLS_VERSION: "20.0"
  JAVA_DISTRIBUTION: "temurin"
  JAVA_VERSION: "17"
  XCODE_VERSION: "26.3.0"

jobs:
  build_librc2d:
    strategy:
      fail-fast: false
      matrix:
        config:
        - { runner: ubuntu-latest,    platform: steamrt4, arch: x64,   container: "registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk:4.0.20260119.200228" }
        - { runner: ubuntu-24.04-arm, platform: steamrt4, arch: arm64, container: "registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk/arm64:4.0.20260119.200228" }
        - { runner: windows-2025,     platform: windows,  arch: x64 }
        - { runner: windows-11-arm,   platform: windows,  arch: arm64 }
        - { runner: ubuntu-22.04,     platform: linux,    arch: x64 }
        - { runner: ubuntu-22.04-arm, platform: linux,    arch: arm64 }
        - { runner: ubuntu-latest,    platform: android,  arch: "armeabi-v7a,arm64-v8a" }
        - { runner: macos-26,         platform: macos,    arch: arm64, sdk: macosx } 
        - { runner: macos-26,         platform: ios,      arch: arm64, sdk: iphoneos }
    name: ${{ matrix.config.platform }}-${{ matrix.config.arch }}-${{ matrix.config.sdk }}
    runs-on: ${{ matrix.config.runner }}
    container: ${{ matrix.config.platform == 'steamrt4' && matrix.config.container || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK LTS - Android
        if: matrix.config.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK (Platform + Build Tools + NDK + CMake + CLI) - Android
        if: matrix.config.platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >
            platform-tools
            platforms;${{ env.ANDROID_PLATFORM_VERSION }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}
            cmake;${{ env.ANDROID_CMAKE_VERSION }}
            cmdline-tools;${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}

      - name: Setup Xcode and Setup Command Line Tools - macOS / iOS
        if: matrix.config.platform == 'ios' || matrix.config.platform == 'macos'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Determine SDK Path and set SDKROOT - macOS / iOS
        if: matrix.config.platform == 'macos' || matrix.config.platform == 'ios'
        run: |
          sdk="${{ matrix.config.sdk }}"
          SDKROOT=$(xcrun --sdk "$sdk" --show-sdk-path)
          SDKVERSION=$(xcrun --sdk "$sdk" --show-sdk-version)
          echo "SDKROOT=$SDKROOT" >> $GITHUB_ENV
          echo "Using SDK: $sdk"
          echo "SDK Path: $SDKROOT"
          echo "SDK Version: $SDKVERSION"
        shell: bash

      - name: Install dev dependencies (for SDL3) - Linux (x64/arm64) / SteamRT4 (x64/arm64)
        if: matrix.config.platform == 'linux' || matrix.config.platform == 'steamrt4'
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential git make \
          pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
      
      - name: Install patchelf - Linux (x64/arm64) / SteamRT4 (x64/arm64)
        if: matrix.config.platform == 'linux' || matrix.config.platform == 'steamrt4' || matrix.config.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Install fuse for .AppImage generation - Linux (x64/arm64)
        if: matrix.config.platform == 'linux'
        run: |
          sudo apt update
          sudo apt -y install libfuse2

      - name: Get dependencies with CMake - All platforms
        run: cmake -P cmake/setup_dependencies.cmake

      - name: Build RC2D (scripts) - Linux (x64/arm64)
        if: matrix.config.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.config.arch }}" = "x64" ]; then
            chmod +x ./build-scripts/generate-project/linux-x64.sh
            ./build-scripts/generate-project/linux-x64.sh
          else
            chmod +x ./build-scripts/generate-project/linux-arm64.sh
            ./build-scripts/generate-project/linux-arm64.sh
          fi

      - name: Build RC2D (scripts) - Windows (x64/arm64)
        if: matrix.config.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ matrix.config.arch }}" -eq "x64") {
            .\build-scripts\generate-project\windows-x64.bat
          } else {
            .\build-scripts\generate-project\windows-arm64.bat
          }

      - name: Build RC2D (scripts) - macOS (arm64)
        if: matrix.config.platform == 'macos'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./build-scripts/generate-project/macos-arm64-nosignedbundleapp.sh
          ./build-scripts/generate-project/macos-arm64-nosignedbundleapp.sh

      - name: Build RC2D (scripts) - iOS (arm64 for iphoneos)
        if: matrix.config.platform == 'ios'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./build-scripts/generate-project/ios-iphoneos-arm64-nosignedbundleapp.sh
          ./build-scripts/generate-project/ios-iphoneos-arm64-nosignedbundleapp.sh

      - name: Build RC2D (scripts) - Android (armeabi-v7a / arm64-v8a)
        if: matrix.config.platform == 'android'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./build-scripts/generate-project/android-unix.sh
          ./build-scripts/generate-project/android-unix.sh

      - name: Build RC2D (scripts) - SteamRT4 (x64 / arm64)
        if: matrix.config.platform == 'steamrt4'
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.config.arch }}" = "x64" ] && [ -f "./build-scripts/generate-project/steamrt4-x64.sh" ]; then
            chmod +x ./build-scripts/generate-project/steamrt4-x64.sh
            ./build-scripts/generate-project/steamrt4-x64.sh
          else
            chmod +x ./build-scripts/generate-project/steamrt4-arm64.sh
            ./build-scripts/generate-project/steamrt4-arm64.sh
          fi

      - name: Print runtime minimums - Linux / SteamRT4
        if: matrix.config.platform == 'linux' || matrix.config.platform == 'steamrt4'
        shell: bash
        run: |
          set -euo pipefail

          platform="${{ matrix.config.platform }}"
          arch="${{ matrix.config.arch }}"
          build_dir="build/${platform}/${arch}/Release"
          exe="${build_dir}/rc2d_example"

          if ! command -v readelf >/dev/null 2>&1; then
            echo "[runtime-check][$platform][$arch] ERROR: readelf is not available"
            exit 1
          fi

          if [ ! -f "$exe" ]; then
            echo "[runtime-check][$platform][$arch] ERROR: executable not found at $exe"
            exit 1
          fi

          glibc_from_file() {
            local file="$1"
            readelf --version-info "$file" 2>/dev/null \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
              | sed 's/^GLIBC_//' \
              | sort -V \
              | tail -n1 || true
          }

          max_version() {
            local current="${1:-}"
            local candidate="${2:-}"
            if [ -z "$candidate" ]; then
              printf '%s' "$current"
              return
            fi
            if [ -z "$current" ]; then
              printf '%s' "$candidate"
              return
            fi
            if [ "$(printf '%s\n%s\n' "$current" "$candidate" | sort -V | tail -n1)" = "$candidate" ]; then
              printf '%s' "$candidate"
            else
              printf '%s' "$current"
            fi
          }

          missing_libs="$(ldd "$exe" | awk '/=> not found/ {print $1}' || true)"
          if [ -n "$missing_libs" ]; then
            echo "[runtime-check][$platform][$arch] ERROR: unresolved shared libraries for $exe"
            echo "$missing_libs" | sed "s/^/[runtime-check][$platform][$arch]   missing=/"
            exit 1
          fi

          closure_file="$(mktemp)"
          {
            echo "$exe"
            ldd "$exe" | awk '
              /=>/ && $3 ~ /^\// { print $3 }
              $1 ~ /^\// { print $1 }
            '
          } | awk '!seen[$0]++' > "$closure_file"

          closure_max_glibc=""
          closure_count=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            closure_count=$((closure_count + 1))
            file_glibc="$(glibc_from_file "$file")"
            closure_max_glibc="$(max_version "$closure_max_glibc" "$file_glibc")"
          done < "$closure_file"

          rm -f "$closure_file"

          echo "[runtime-check][$platform][$arch] executable=$exe"
          echo "[runtime-check][$platform][$arch] runtime closure files (exe + resolved shared libs)=$closure_count"
          echo "[runtime-check][$platform][$arch] required GLIBC for runtime closure (max symbol version)=${closure_max_glibc:-none-detected}"

      - name: Print runtime minimums - Windows
        if: matrix.config.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $platform = "${{ matrix.config.platform }}"
          $arch = "${{ matrix.config.arch }}"
          $buildDir = "build/windows/$arch"
          $exe = "$buildDir/Release/rc2d_example.exe"
          $cachePath = "$buildDir/CMakeCache.txt"

          function Get-CMakeCacheValue {
            param(
              [string]$Path,
              [string]$Key
            )
            if (-not (Test-Path $Path)) {
              return $null
            }
            $line = Select-String -Path $Path -Pattern ("^" + [regex]::Escape($Key) + ":[^=]*=") | Select-Object -First 1
            if (-not $line) {
              return $null
            }
            return ($line.Line -split "=", 2)[1]
          }

          function Get-PeInfo {
            param([string]$Path)

            [byte[]]$bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 256) {
              throw "File is too small to be a valid PE: $Path"
            }

            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Missing MZ signature: $Path"
            }

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -lt 0 -or ($peOffset + 88) -ge $bytes.Length) {
              throw "Invalid PE header offset: $Path"
            }

            $peSignature = [BitConverter]::ToUInt32($bytes, $peOffset)
            if ($peSignature -ne 0x00004550) {
              throw "Missing PE signature: $Path"
            }

            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            $optOffset = $peOffset + 24
            $magic = [BitConverter]::ToUInt16($bytes, $optOffset)

            $majorOs = [BitConverter]::ToUInt16($bytes, $optOffset + 40)
            $minorOs = [BitConverter]::ToUInt16($bytes, $optOffset + 42)
            $majorImage = [BitConverter]::ToUInt16($bytes, $optOffset + 44)
            $minorImage = [BitConverter]::ToUInt16($bytes, $optOffset + 46)
            $majorSubsystem = [BitConverter]::ToUInt16($bytes, $optOffset + 48)
            $minorSubsystem = [BitConverter]::ToUInt16($bytes, $optOffset + 50)

            $machineLabel = switch ($machine) {
              0x8664 { "x64" }
              0xAA64 { "arm64" }
              0x014C { "x86" }
              default { "unknown" }
            }

            $formatLabel = switch ($magic) {
              0x20B { "PE32+" }
              0x10B { "PE32" }
              default { "unknown" }
            }

            return [PSCustomObject]@{
              Machine = $machine
              MachineLabel = $machineLabel
              Format = $formatLabel
              MajorOs = $majorOs
              MinorOs = $minorOs
              MajorImage = $majorImage
              MinorImage = $minorImage
              MajorSubsystem = $majorSubsystem
              MinorSubsystem = $minorSubsystem
            }
          }

          if (-not (Test-Path $exe)) {
            Write-Host "[runtime-check][$platform][$arch] ERROR: executable not found at $exe"
            exit 1
          }

          $cmakeSystemVersion = Get-CMakeCacheValue -Path $cachePath -Key "CMAKE_SYSTEM_VERSION"
          $pe = Get-PeInfo -Path $exe

          $dllDir = Split-Path -Parent $exe
          $bundledDlls = @(Get-ChildItem -Path $dllDir -Filter *.dll -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)

          $closureCount = 1 + $bundledDlls.Count
          $closureMaxOs = "{0}.{1}" -f $pe.MajorOs, $pe.MinorOs
          $closureMaxSubsystem = "{0}.{1}" -f $pe.MajorSubsystem, $pe.MinorSubsystem

          foreach ($dll in $bundledDlls) {
            try {
              $dllPe = Get-PeInfo -Path $dll
            } catch {
              Write-Host "[runtime-check][$platform][$arch] WARN: failed to parse DLL header: $dll"
              continue
            }

            $dllOs = "{0}.{1}" -f $dllPe.MajorOs, $dllPe.MinorOs
            $dllSubsystem = "{0}.{1}" -f $dllPe.MajorSubsystem, $dllPe.MinorSubsystem

            if ([version]$dllOs -gt [version]$closureMaxOs) {
              $closureMaxOs = $dllOs
            }
            if ([version]$dllSubsystem -gt [version]$closureMaxSubsystem) {
              $closureMaxSubsystem = $dllSubsystem
            }
          }

          Write-Host "[runtime-check][$platform][$arch] executable=$exe"
          if ($cmakeSystemVersion) {
            Write-Host "[runtime-check][$platform][$arch] CMAKE_SYSTEM_VERSION=$cmakeSystemVersion"
          }
          Write-Host "[runtime-check][$platform][$arch] runtime closure files (exe + bundled dll)=$closureCount"
          Write-Host "[runtime-check][$platform][$arch] PE format=$($pe.Format)"
          Write-Host "[runtime-check][$platform][$arch] PE machine=$($pe.MachineLabel) (0x$("{0:X4}" -f $pe.Machine))"
          Write-Host "[runtime-check][$platform][$arch] PE OS version=$($pe.MajorOs).$($pe.MinorOs)"
          Write-Host "[runtime-check][$platform][$arch] PE image version=$($pe.MajorImage).$($pe.MinorImage)"
          Write-Host "[runtime-check][$platform][$arch] PE subsystem version=$($pe.MajorSubsystem).$($pe.MinorSubsystem)"
          Write-Host "[runtime-check][$platform][$arch] required PE OS version for runtime closure=$closureMaxOs"
          Write-Host "[runtime-check][$platform][$arch] required PE subsystem version for runtime closure=$closureMaxSubsystem"

      - name: Print runtime minimums - macOS / iOS
        if: matrix.config.platform == 'macos' || matrix.config.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail

          platform="${{ matrix.config.platform }}"
          arch="${{ matrix.config.arch }}"

          minos_from_macho() {
            local file="$1"
            otool -l "$file" | awk '
              $1=="cmd" && $2=="LC_BUILD_VERSION" { mode="build"; next }
              mode=="build" && $1=="minos" { print $2; exit }
              $1=="cmd" && ($2=="LC_VERSION_MIN_MACOSX" || $2=="LC_VERSION_MIN_IPHONEOS") { mode="legacy"; next }
              mode=="legacy" && $1=="version" { print $2; exit }
            '
          }

          max_version() {
            local current="${1:-}"
            local candidate="${2:-}"
            if [ -z "$candidate" ]; then
              printf '%s' "$current"
              return
            fi
            if [ -z "$current" ]; then
              printf '%s' "$candidate"
              return
            fi
            if [ "$(printf '%s\n%s\n' "$current" "$candidate" | sort -V | tail -n1)" = "$candidate" ]; then
              printf '%s' "$candidate"
            else
              printf '%s' "$current"
            fi
          }

          if [ "$platform" = "macos" ]; then
            root="build/macos/$arch"
            cache="$root/CMakeCache.txt"
            app_path="$(find "$root" -type d -path "*/Release*/rc2d_example.app" -print -quit || true)"
            if [ -z "$app_path" ]; then
              app_path="$(find "$root" -type d -name "rc2d_example.app" -print -quit || true)"
            fi
            plist_path="$app_path/Contents/Info.plist"
            exe_path="$app_path/Contents/MacOS/rc2d_example"
          else
            root="build/ios/iphoneos"
            cache="$root/CMakeCache.txt"
            app_path="$(find "$root" -type d -path "*/Release*/rc2d_example.app" -print -quit || true)"
            if [ -z "$app_path" ]; then
              app_path="$(find "$root" -type d -name "rc2d_example.app" -print -quit || true)"
            fi
            plist_path="$app_path/Info.plist"
            exe_path="$app_path/rc2d_example"
          fi

          if [ -z "${app_path:-}" ] || [ ! -d "$app_path" ]; then
            echo "[runtime-check][$platform][$arch] ERROR: app bundle not found"
            exit 1
          fi

          if [ ! -f "$exe_path" ]; then
            if [ "$platform" = "macos" ] && [ -d "$app_path/Contents/MacOS" ]; then
              exe_path="$(find "$app_path/Contents/MacOS" -type f -print -quit || true)"
            else
              exe_path="$(find "$app_path" -maxdepth 1 -type f -print -quit || true)"
            fi
          fi

          if [ -z "${exe_path:-}" ] || [ ! -f "$exe_path" ]; then
            echo "[runtime-check][$platform][$arch] ERROR: executable not found in app bundle $app_path"
            exit 1
          fi

          cmake_target="$(awk -F= '/^CMAKE_OSX_DEPLOYMENT_TARGET:/{print $2; exit}' "$cache" 2>/dev/null || true)"
          exe_minos="$(minos_from_macho "$exe_path")"

          echo "[runtime-check][$platform][$arch] app_bundle=$app_path"
          echo "[runtime-check][$platform][$arch] executable=$exe_path"
          if [ -n "$cmake_target" ]; then
            echo "[runtime-check][$platform][$arch] CMAKE_OSX_DEPLOYMENT_TARGET=$cmake_target"
          fi
          echo "[runtime-check][$platform][$arch] executable minos=${exe_minos:-unknown}"

          if [ -f "$plist_path" ]; then
            if [ "$platform" = "macos" ]; then
              plist_min=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$plist_path" 2>/dev/null || true)
              if [ -n "$plist_min" ]; then
                echo "[runtime-check][$platform][$arch] Info.plist LSMinimumSystemVersion=$plist_min"
              fi
            else
              plist_min=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$plist_path" 2>/dev/null || true)
              if [ -n "$plist_min" ]; then
                echo "[runtime-check][$platform][$arch] Info.plist MinimumOSVersion=$plist_min"
              fi
            fi
          fi

          add_unique_line() {
            local list_file="$1"
            local value="$2"
            if ! grep -Fqx "$value" "$list_file" 2>/dev/null; then
              printf '%s\n' "$value" >> "$list_file"
            fi
          }

          closure_list="$(mktemp)"
          external_non_system_list="$(mktemp)"
          unresolved_absolute_list="$(mktemp)"

          bundle_macho_count=0
          while IFS= read -r -d '' file; do
            if file -b "$file" 2>/dev/null | grep -q "Mach-O"; then
              add_unique_line "$closure_list" "$file"
              bundle_macho_count=$((bundle_macho_count + 1))
            fi
          done < <(find "$app_path" -type f -print0)

          idx=1
          while true; do
            total="$(wc -l < "$closure_list" | tr -d ' ')"
            if [ "$idx" -gt "$total" ]; then
              break
            fi

            current="$(sed -n "${idx}p" "$closure_list")"
            idx=$((idx + 1))
            [ -f "$current" ] || continue

            while IFS= read -r dep; do
              case "$dep" in
                /*)
                  if [ -f "$dep" ]; then
                    if file -b "$dep" 2>/dev/null | grep -q "Mach-O"; then
                      add_unique_line "$closure_list" "$dep"
                    fi
                    case "$dep" in
                      /System/*|/usr/lib/*) ;;
                      *) add_unique_line "$external_non_system_list" "$dep" ;;
                    esac
                  else
                    add_unique_line "$unresolved_absolute_list" "$dep"
                  fi
                ;;
              esac
            done < <(otool -L "$current" | tail -n +2 | awk '{print $1}')
          done

          closure_max_minos=""
          closure_count=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            closure_count=$((closure_count + 1))
            file_minos="$(minos_from_macho "$file")"
            closure_max_minos="$(max_version "$closure_max_minos" "$file_minos")"
          done < "$closure_list"

          external_non_system_count="$(wc -l < "$external_non_system_list" | tr -d ' ')"
          unresolved_absolute_count="$(wc -l < "$unresolved_absolute_list" | tr -d ' ')"

          echo "[runtime-check][$platform][$arch] Mach-O files inside app bundle=$bundle_macho_count"
          echo "[runtime-check][$platform][$arch] runtime closure files (bundle + resolved absolute dylibs)=$closure_count"
          echo "[runtime-check][$platform][$arch] required minos for runtime closure=${closure_max_minos:-unknown}"

          if [ "$external_non_system_count" -gt 0 ]; then
            echo "[runtime-check][$platform][$arch] external non-system dylibs detected=$external_non_system_count"
            sed "s|^|[runtime-check][$platform][$arch]   external_dylib=|" "$external_non_system_list"
          fi

          if [ "$unresolved_absolute_count" -gt 0 ]; then
            echo "[runtime-check][$platform][$arch] WARN: unresolved absolute dylibs in load commands=$unresolved_absolute_count"
            sed "s|^|[runtime-check][$platform][$arch]   unresolved_dylib=|" "$unresolved_absolute_list"
          fi

          rm -f "$closure_list" "$external_non_system_list" "$unresolved_absolute_list"

      - name: Print runtime minimums - Android
        if: matrix.config.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail

          platform="${{ matrix.config.platform }}"
          arch="${{ matrix.config.arch }}"
          apk_path="android-project/app/build/outputs/apk/debug/app-debug.apk"

          cache_path="$(find android-project -type f -name CMakeCache.txt -print -quit || true)"
          if [ -n "$cache_path" ]; then
            cmake_android_api="$(awk -F= '/^CMAKE_ANDROID_API:/{print $2; exit}' "$cache_path" 2>/dev/null || true)"
            if [ -n "$cmake_android_api" ]; then
              echo "[runtime-check][$platform][$arch] CMAKE_ANDROID_API=$cmake_android_api"
            fi
          fi

          if [ ! -f "$apk_path" ]; then
            echo "[runtime-check][$platform][$arch] ERROR: APK not found at $apk_path"
            exit 1
          fi

          echo "[runtime-check][$platform][$arch] apk=$apk_path"

          aapt_bin="$(find "${ANDROID_HOME:-}" -type f -name aapt 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -n "$aapt_bin" ]; then
            sdk_lines="$("$aapt_bin" dump badging "$apk_path" | grep -E "sdkVersion:'|targetSdkVersion:'" || true)"
            if [ -n "$sdk_lines" ]; then
              echo "$sdk_lines" | sed "s/^/[runtime-check][$platform][$arch] /"
            else
              echo "[runtime-check][$platform][$arch] WARN: sdkVersion/targetSdkVersion not found in APK metadata"
            fi
          else
            echo "[runtime-check][$platform][$arch] WARN: aapt not found in ANDROID_HOME"
          fi

          tmpdir="$(mktemp -d)"
          unzip -qq "$apk_path" "lib/*/*.so" -d "$tmpdir" || true
          mapfile -t native_libs < <(find "$tmpdir/lib" -type f -name '*.so' 2>/dev/null | sort)
          native_count="${#native_libs[@]}"
          echo "[runtime-check][$platform][$arch] runtime closure files (native .so in APK)=$native_count"

          if [ "$native_count" -gt 0 ]; then
            if command -v readelf >/dev/null 2>&1; then
              max_native_sdk=""
              for so in "${native_libs[@]}"; do
                so_sdk="$(readelf -n "$so" 2>/dev/null | awk '/Android SDK version:/ {print $NF; exit}' || true)"
                if [ -n "$so_sdk" ]; then
                  if [ -z "$max_native_sdk" ] || [ "$so_sdk" -gt "$max_native_sdk" ]; then
                    max_native_sdk="$so_sdk"
                  fi
                fi
              done

              if [ -n "$max_native_sdk" ]; then
                echo "[runtime-check][$platform][$arch] required Android native SDK for runtime closure (max ELF note)=$max_native_sdk"
              else
                echo "[runtime-check][$platform][$arch] WARN: no Android SDK ELF note found in native .so files"
              fi
            else
              echo "[runtime-check][$platform][$arch] WARN: readelf not available to inspect native .so files"
            fi
          fi

          rm -rf "$tmpdir"

      - name: Inspect APK (Debug) - Android
        if: matrix.config.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ app-debug.apk not found"
            exit 1
          fi

          echo "✅ Inspecting $APK"
          unzip -l "$APK"
  
