name: Generate RC2D library static (production)

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

env:
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_PLATFORM_VERSION: "android-36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_CMAKE_VERSION: "3.30.3"
  ANDROID_CMDLINE_TOOLS_VERSION: "20.0"
  JAVA_DISTRIBUTION: "temurin"
  JAVA_VERSION: "17"
  XCODE_VERSION: "26.3.0"

jobs:
  build_librc2d:
    strategy:
      fail-fast: false
      matrix:
        config:
        - { runner: ubuntu-latest,    platform: steamrt4, arch: x64, container: "registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk:4.0.20260119.200228" }
        - { runner: ubuntu-24.04-arm, platform: steamrt4, arch: arm64,  container: "registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk/arm64:4.0.20260119.200228" }
        - { runner: windows-2025,     platform: windows,  arch: x64 }
        - { runner: windows-2025,     platform: windows,  arch: arm64 }
        - { runner: ubuntu-22.04,     platform: linux,    arch: x64 }
        - { runner: ubuntu-22.04,     platform: linux,    arch: arm64 }
        - { runner: ubuntu-latest,    platform: android,  arch: "armeabi-v7a,arm64-v8a" }
        - { runner: macos-26,         platform: macos,    arch: arm64, sdk: macosx } 
        - { runner: macos-26,         platform: ios,      arch: arm64, sdk: iphoneos }
    name: ${{ matrix.config.platform }}-${{ matrix.config.arch }}-${{ matrix.config.sdk }}
    runs-on: ${{ matrix.config.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java JDK LTS - Android
        if: matrix.config.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK (Platform + Build Tools + NDK + CMake + CLI) - Android
        if: matrix.config.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: >
            platform-tools
            platforms;${{ env.ANDROID_PLATFORM_VERSION }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}
            cmake;${{ env.ANDROID_CMAKE_VERSION }}
            cmdline-tools;${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}

      - name: Setup Xcode and Setup Command Line Tools - macOS / iOS
        if: matrix.config.platform == 'ios' || matrix.config.platform == 'macos'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Determine SDK Path and set SDKROOT - macOS / iOS
        if: matrix.config.platform == 'macos' || matrix.config.platform == 'ios'
        run: |
          sdk="${{ matrix.config.sdk }}"
          SDKROOT=$(xcrun --sdk "$sdk" --show-sdk-path)
          SDKVERSION=$(xcrun --sdk "$sdk" --show-sdk-version)
          echo "SDKROOT=$SDKROOT" >> $GITHUB_ENV
          echo "Using SDK: $sdk"
          echo "SDK Path: $SDKROOT"
          echo "SDK Version: $SDKVERSION"
        shell: bash

      - name: Install dev dependencies (for SDL3) - Linux (x64/arm64)
        if: matrix.config.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential git make \
          pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
      
      - name: Install patchelf - Linux (x64/arm64) / SteamRT4 (x64/arm64)
        if: matrix.config.platform == 'linux' || matrix.config.platform == 'steamrt4'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Install fuse for .AppImage generation - Linux (x64/arm64)
        if: matrix.config.platform == 'linux'
        run: |
          sudo apt update
          sudo apt -y install libfuse2

      - name: Get dependencies with CMake - All platforms
        run: cmake -P cmake/setup_dependencies.cmake

      # TODO: Build RC2D via les scripts dans build-scripts/ pour chaque plateforme et architecture
      - name: Build RC2D (scripts) - Linux
        if: matrix.config.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.config.arch }}" = "x64" ]; then
            chmod +x ./build-scripts/generate-project/linux-x64.sh
            ./build-scripts/generate-project/linux-x64.sh
          else
            chmod +x ./build-scripts/generate-project/linux-arm64.sh
            ./build-scripts/generate-project/linux-arm64.sh
          fi

      - name: Build RC2D (scripts) - Windows
        if: matrix.config.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ matrix.config.arch }}" -eq "x64") {
            .\build-scripts\generate-project\windows-x64.bat
          } else {
            .\build-scripts\generate-project\windows-arm64.bat
          }

      - name: Build RC2D (scripts) - macOS
        if: matrix.config.platform == 'macos'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./build-scripts/generate-project/macos-arm64.sh
          ./build-scripts/generate-project/macos-arm64.sh

      - name: Build RC2D (scripts) - iOS
        if: matrix.config.platform == 'ios'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./build-scripts/generate-project/ios-iphoneos-arm64.sh
          ./build-scripts/generate-project/ios-iphoneos-arm64.sh

      - name: Build RC2D (scripts) - Android
        if: matrix.config.platform == 'android'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./build-scripts/generate-project/android-unix.sh
          ./build-scripts/generate-project/android-unix.sh

      - name: Build RC2D (docker-compose) - SteamRT4
        if: matrix.config.platform == 'steamrt4'
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.config.arch }}" = "x64" ] && [ -f "./build-scripts/generate-project/steamrt4-x64.sh" ]; then
            chmod +x ./build-scripts/generate-project/steamrt4-x64.sh
            ./build-scripts/generate-project/steamrt4-x64.sh
          else
            chmod +x ./build-scripts/generate-project/steamrt4-arm64.sh
            ./build-scripts/generate-project/steamrt4-arm64.sh
          fi

      # TODO: Upload les fichiers binaires générés ("librc2d_static" de tout les dossier de chaque plateforme/arch) en tant qu'artifacts pour chaque plateforme et architecture

  deploy_assets_github:
    needs: build_librc2d
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v7

        # TODO: Finir ici pour Organiser les fichiers binaires et headers téléchargés en les regroupant par plateforme et architecture, puis les compresser (zip ou tar.gz) pour les préparer à la publication sur GitHub Releases
      - name: Organize Artifacts
        run: |
          # Organize Android artifacts
          mkdir -p android/arm64-v8a android/armeabi-v7a
          # TODO
          zip -r librc2d-android.zip android/

          # Organize Windows artifacts
          mkdir -p windows/x64 windows/arm64
          # TODO
          zip -r librc2d-windows.zip windows/

          # Organize macOS artifacts
          mkdir -p macos/arm64
          # TODO
          tar -czvf librc2d-macos.tar.gz macos/

          # Organize iOS artifacts
          mkdir -p ios/iphoneos-arm64
          # TODO
          tar -czvf librc2d-ios.tar.gz ios/

          # Organize Linux artifacts
          mkdir -p linux/x64 linux/arm64
          # TODO
          tar -czvf librc2d-linux.tar.gz linux/

          # Organize SteamRT4 artifacts
          mkdir -p steamrt4/x64 steamrt4/arm64
          # TODO
          zip -r librc2d-steamrt4.zip steamrt4/

          # Organize Include artifacts
          tar -czvf include.tar.gz include/RC2D/

      - name: Deploy libraries assets - Release Github
        uses: softprops/action-gh-release@v2
        with:
          files: |
            librc2d-android.zip
            librc2d-windows.zip
            librc2d-macos.tar.gz
            librc2d-ios.tar.gz
            librc2d-linux.tar.gz
            librc2d-steamrt4.zip
            include.tar.gz

  build_deploy_website:
    needs: deploy_assets_github
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js latest LTS and setup cache
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci
        working-directory: ./docs

      - name: Build with VitePress
        run: npm run build
        working-directory: ./docs

      - name: Deploy files website static for docs API RC2D
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.O2SWITCH_FTP_HOST }}
          username: ${{ secrets.O2SWITCH_FTP_USERNAME }}
          password: ${{ secrets.O2SWITCH_FTP_PASSWORD }}
          port: ${{ secrets.O2SWITCH_FTP_PORT }}
          protocol: ftp
          local-dir: ./docs/.vitepress/dist/
          server-dir: librc2d.crzcommon2.com/
          exclude: |
            dist